<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Lote</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
      background-color: #f4f6f9;
    }
    .card {
      background: #fff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    h2 {
      margin-top: 0;
      color: #333;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }
    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }
    th {
      background-color: #f8f9fa;
    }
    input[type="number"] {
      width: 80px;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    input[type="number"]:focus {
      border-color: #0d6efd;
      outline: 2px solid #86b7fe;
    }
    .resultado-final {
      background: #e9ecef;
      padding: 15px;
      border-radius: 6px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #212529;
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
    }
    .subtotal {
      font-weight: bold;
      color: #495057;
    }
    .btn-limpar {
      width: 100%;
      padding: 10px;
      background-color: #dc3545;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-limpar:hover {
      background-color: #bb2d3b;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Cálculo de Peso do Lote</h2>
  
  <table>
    <thead>
      <tr>
        <th>Item (Peso Unitário)</th>
        <th>Quantidade</th>
        <th>Subtotal (kg)</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>0,250 kg (250g)</td>
        <td><input type="number" min="0" value="0" data-peso="0.250" oninput="calcular()" onkeydown="mudarComEnter(event, 0)" onclick="this.select()"></td>
        <td class="subtotal">0.000 kg</td>
      </tr>
      <tr>
        <td>0,350 kg (350g)</td>
        <td><input type="number" min="0" value="0" data-peso="0.350" oninput="calcular()" onkeydown="mudarComEnter(event, 1)" onclick="this.select()"></td>
        <td class="subtotal">0.000 kg</td>
      </tr>
      <tr>
        <td>0,500 kg (500g)</td>
        <td><input type="number" min="0" value="0" data-peso="0.500" oninput="calcular()" onkeydown="mudarComEnter(event, 2)" onclick="this.select()"></td>
        <td class="subtotal">0.000 kg</td>
      </tr>
      <tr>
        <td>1,000 kg (1kg)</td>
        <td><input type="number" min="0" value="0" data-peso="1.000" oninput="calcular()" onkeydown="mudarComEnter(event, 3)" onclick="this.select()"></td>
        <td class="subtotal">0.000 kg</td>
      </tr>
    </tbody>
  </table>

  <div class="resultado-final">
    <span>Peso Total do Lote:</span>
    <span id="total-geral">0.000 kg</span>
  </div>

  <button id="btn-limpar" class="btn-limpar" onclick="limpar()">Limpar Campos</button>
</div>

<script>
  function calcular() {
    const inputs = document.querySelectorAll('input[type="number"]');
    let totalGeral = 0;

    inputs.forEach(input => {
      const pesoUnitario = parseFloat(input.getAttribute('data-peso')) || 0;
      const quantidade = parseInt(input.value) || 0;
      const subtotal = pesoUnitario * quantidade;

      // Atualiza o subtotal da linha
      const tdSubtotal = input.closest('tr').querySelector('.subtotal');
      tdSubtotal.textContent = subtotal.toFixed(3) + ' kg';

      totalGeral += subtotal;
    });

    // Atualiza o total geral
    document.getElementById('total-geral').textContent = totalGeral.toFixed(3) + ' kg';
  }

  function mudarComEnter(event, indexAtual) {
    if (event.key === 'Enter') {
      event.preventDefault(); // Impede o envio padrão de formulários
      const inputs = document.querySelectorAll('input[type="number"]');
      
      // Se houver um próximo campo, move o foco para ele e seleciona o texto
      if (indexAtual + 1 < inputs.length) {
        inputs[indexAtual + 1].focus();
        inputs[indexAtual + 1].select();
      } else {
        // Se for o último campo, vai para o botão limpar
        document.getElementById('btn-limpar').focus();
      }
    }
  }

  function limpar() {
    const inputs = document.querySelectorAll('input[type="number"]');
    inputs.forEach(input => {
      input.value = 0;
    });
    calcular();
    // Foca de volta no primeiro campo após limpar
    inputs[0].focus();
    inputs[0].select();
  }
</script>

</body>
</html>
